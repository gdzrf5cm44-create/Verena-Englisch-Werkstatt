<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf2ed"><title>Verena · English Workshop</title>
<style>
:root{--ink:#243d43;--green:#286d61;--muted:#61767a;--line:#d9e6df;--bg:#f4f7f3;--pale:#e7f3ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #dbad57;outline-offset:3px}.wrap{max-width:1050px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 24px}.brand{font-weight:850;font-size:21px}.brand span{color:var(--green)}.pill,.tag{border-radius:30px;font-size:12px;padding:7px 12px;background:white;border:1px solid var(--line)}.tag{background:var(--pale);color:var(--green);border:0;font-weight:700}.hero{background:linear-gradient(120deg,#d9eee5,#fff8e8);padding:32px;border-radius:24px;margin-bottom:20px}h1{font-size:clamp(31px,5vw,48px);line-height:1.15;margin:8px 0}h2{font-size:25px;margin:10px 0}p{color:var(--muted);margin:9px 0 16px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:var(--green)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:11px 16px;border-radius:13px;font-weight:700}.btn.primary,.btn.active{background:var(--green);border-color:var(--green);color:white}.btn:disabled{opacity:.6;cursor:default}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:20px;background:white;padding:22px;display:flex;flex-direction:column;gap:9px;min-height:185px;text-align:left}.card strong{font-size:20px}.emoji{font-size:32px}.small{font-size:13px;color:var(--muted)}.panel{max-width:800px;margin:auto;background:white;border:1px solid var(--line);border-radius:22px;padding:25px}.rule{padding:16px;border-radius:14px;background:var(--pale);margin:16px 0}.rule p{margin:7px 0}.example{color:var(--green);font-weight:750}.q{font-size:clamp(21px,4vw,30px);font-weight:750;margin:22px 0}.choices{display:grid;gap:10px}.choice{width:100%;padding:14px;text-align:left;border-radius:13px;background:white;border:1px solid var(--line);font-weight:650}.choice.right{background:#dff3e6;border-color:#56a37b}.choice.wrong{background:#fff0e4;border-color:#dba77f}.feedback{background:#f1f6f2;border-radius:14px;padding:15px;margin:17px 0}.answer{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.notice{padding:12px 15px;background:#fff6df;border-radius:13px;font-size:14px;margin:16px 0}.item{padding:15px 0;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.track{height:8px;border-radius:9px;background:#e7eeea;margin-top:9px;overflow:hidden}.fill{height:100%;background:#4b9c86}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f1f6f2;border-radius:14px;padding:15px}.stat strong{font-size:25px;display:block}.audio{padding:25px;background:var(--pale);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:700}footer{padding:25px 0;color:var(--muted);font-size:12px}@media(max-width:730px){.grid{grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.hero{padding:23px}}@media(max-width:480px){.grid,.stats{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div class="brand">VERENA <span>· english workshop</span></div><div class="pill">6. Klasse · Realschule Bayern</div></header><main id="app"></main><footer>Eigenständige Lernwerkstatt · Unit 1 · Lerndaten nur auf diesem Gerät gespeichert · Keine Verbindung zu Sophias Apps</footer></div>
<script>
'use strict';
const grammar=[
{id:'g1',name:'G1 · Simple Past',rule:'Abgeschlossene Vergangenheit: regelmäßige Verben + -ed. Nach did oder didn’t steht die Grundform.',ex:'We visited London yesterday.',qs:[['Yesterday Mia ___ her aunt.',['visits','visited','visiting'],1,'Yesterday zeigt die Vergangenheit.'],['We didn’t ___ the museum.',['visited','visit','visiting'],1,'Nach didn’t steht die Grundform.'],['___ Ben buy a ticket?',['Did','Does','Was'],0,'Fragen: Did + Person + Grundform?'],['They ___ a film last night.',['saw','see','seen'],0,'see – saw – seen: Simple Past = saw.'],['Schreibe die Simple-Past-Form von buy.','bought','buy – bought – bought.']]},
{id:'g2',name:'G2 · be / was / were',rule:'Gegenwart: am/is/are. Vergangenheit: I/he/she/it was; you/we/they were.',ex:'Were you in London? Yes, I was.',qs:[['Yesterday I ___ at home.',['was','were','am'],0,'I was in der Vergangenheit.'],['The children ___ happy yesterday.',['was','were','are'],1,'Mehrzahl: they were.'],['___ your brother at school yesterday?',['Was','Were','Is'],0,'Brother = he, also was.'],['No, we ___ late.',['wasn’t','weren’t','aren’t'],1,'we were → we weren’t.'],['Schreibe: We ___ in London last year.','were','Bei we steht were.']]},
{id:'g3',name:'G3 · Present Perfect',rule:'have/has + dritte Verbform. I/you/we/they have; he/she/it has. Signalwörter: just, already, yet.',ex:'Lucy has already finished her homework.',qs:[['Lucy ___ already finished her homework.',['have','has','is'],1,'Lucy = she → has.'],['I have just ___ a sandwich.',['eat','ate','eaten'],2,'Nach have steht die dritte Verbform.'],['We haven’t ___ the film yet.',['see','saw','seen'],2,'Die dritte Form von see ist seen.'],['He ___ done his homework yet.',['hasn’t','haven’t','doesn’t'],0,'he → hasn’t.'],['Schreibe die dritte Form von write.','written','write – wrote – written.']]},
{id:'g4',name:'G4 · Present Perfect: Fragen',rule:'Have/Has + Person + dritte Verbform? Kurzantworten: Yes, I have. / No, she hasn’t.',ex:'Have you ever been to London? No, I haven’t.',qs:[['___ you ever been to London?',['Have','Has','Did'],0,'Bei you: Have you ever ...?'],['Has Leo ___ his room yet?',['clean','cleaned','cleaning'],1,'Nach has steht die dritte Verbform.'],['Have they finished? Yes, they ___.',['has','have','did'],1,'Yes, they have.'],['Has she seen the film? No, she ___.',['haven’t','hasn’t','isn’t'],1,'No, she hasn’t.'],['Schreibe die dritte Form von be.','been','be – was/were – been.']]}
];
const verbs=[['be','was/were','been','sein','I/he/she/it was – you/we/they were.'],['go','went','gone','gehen','Drei verschiedene Formen: go – went – gone.'],['see','saw','seen','sehen','ee – aw – ee: den Vokalwechsel merken.'],['do','did','done','tun','Als Dreier-Rhythmus sprechen: do – did – done.'],['have','had','had','haben','Zweite und dritte Form sind gleich.'],['make','made','made','machen','Zweite und dritte Form sind gleich.'],['buy','bought','bought','kaufen','Klangfamilie: buy – bought – bought.'],['think','thought','thought','denken','Klangfamilie mit bought: thought – thought.'],['write','wrote','written','schreiben','Drei Formen; dritte Form endet auf -en.'],['eat','ate','eaten','essen','Dritte Form endet auf -en.'],['take','took','taken','nehmen','Dritte Form endet auf -en.'],['give','gave','given','geben','Dritte Form endet auf -en.'],['sing','sang','sung','singen','Vokalreihe i – a – u.'],['drink','drank','drunk','trinken','Vokalreihe i – a – u.'],['swim','swam','swum','schwimmen','Vokalreihe i – a – u.'],['come','came','come','kommen','Erste und dritte Form sind gleich.'],['run','ran','run','laufen','Erste und dritte Form sind gleich.'],['put','put','put','legen','Alle drei Formen sind gleich.'],['read','read','read','lesen','Gleiche Schreibweise! Grundform klingt wie „reed“, Vergangenheit wie „red“.'],['build','built','built','bauen','Zweite und dritte Form sind gleich.'],['find','found','found','finden','Zweite und dritte Form sind gleich.'],['say','said','said','sagen','Zweite und dritte Form sind gleich.']];
const listening=[
['G1','Yesterday, Lucy visited a museum in London.','Where did Lucy go yesterday?',['To a museum','To a swimming pool','To a cinema'],0,'visited steht im Simple Past.'],
['G2','Ben and Mia were at the station yesterday.','Where were Ben and Mia?',['At school','At the station','At home'],1,'were ist die Vergangenheit von be für mehrere Personen.'],
['G3','Lucy has already finished her homework.','What has Lucy already done?',['She has finished her homework.','She has started her homework.','She hasn’t done her homework.'],0,'has already finished = hat schon fertiggemacht.'],
['G3','Tom has not bought the tickets yet.','Has Tom bought the tickets?',['Yes, he has.','No, he hasn’t.','He bought two tickets.'],1,'has not ... yet = noch nicht.'],
['G4','Have you ever been to London? Yes, I have.','Has the person been to London?',['Yes','No','We don’t know'],0,'Yes, I have ist eine positive Kurzantwort.'],
['G4','Has Emma seen the film yet? No, she hasn’t.','Has Emma seen the film?',['Yes, she has.','No, she hasn’t.','She is watching it now.'],1,'No, she hasn’t ist eine verneinte Kurzantwort.']
];
const KEY='verena-english-unit1-v1';let hist=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))hist=saved}catch(e){};
let page='home',chapter=0,q=0,chosen=null,typed='',stage=0,vi=0,li=0,session=[],verbMode=false,listenMode=false;
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(hist))}catch(e){}}
function record(area,topic,question,answer,expected,correct){let r={date:new Date().toISOString(),area,topic,question,answer,expected,correct};hist.push(r);session.push(r);save()}
function go(p){if('speechSynthesis' in window)speechSynthesis.cancel();page=p;chosen=null;render();window.scrollTo(0,0)}
function navigation(){return '<nav>'+[['home','🏠 Start'],['grammar','📖 Grammatik'],['verbs','🧠 Irregular Verbs'],['listening','🎧 Listening'],['coach','📊 Lerncoach']].map(x=>'<button class="btn '+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav>'}
function home(){return '<section class="hero"><div class="eyebrow">Little steps. Big progress.</div><h1>Hey Verena! 👋<br>Ready for English?</h1><p>Kurze Übungen, verständliche Erklärungen und kein Zeitdruck.</p><button class="btn primary" onclick="go(\'grammar\')">Jetzt starten →</button></section><div class="grid"><button class="card" onclick="go(\'grammar\')"><span class="emoji">📖</span><strong>Grammar Workshop</strong><span>Unit 1 · G1–G4</span><span class="small">Erkennen und Schreiben</span></button><button class="card" onclick="go(\'verbs\')"><span class="emoji">🧠</span><strong>Irregular Verbs</strong><span>Merkhilfen & drei Stufen</span><span class="small">Multiple Choice · Schreiben · Sätze</span></button><button class="card" onclick="go(\'listening\')"><span class="emoji">🎧</span><strong>Listening Workshop</strong><span>Unit 1 · G1–G4</span><span class="small">Hören und verstehen</span></button></div>'}
function grammarHome(){return '<div class="panel"><span class="tag">Unit 1 · Welcome to London</span><h2>Grammar Workshop</h2><p>Die Kapitel G1 bis G4 folgen den Grammatikthemen des Schulbuchs. Alle Aufgaben sind neu formuliert.</p>'+grammar.map((g,i)=>{let h=hist.filter(x=>x.area==='Grammatik'&&x.topic===g.id),pct=h.length?Math.round(h.filter(x=>x.correct).length/h.length*100):0;return '<div class="item"><div class="row"><div><strong>'+g.name+'</strong><div class="small">'+(h.length?h.length+' Antworten · '+pct+' % richtig':'Noch nicht gestartet')+'</div></div><button class="btn" onclick="startGrammar('+i+')">Üben →</button></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join('')+'</div>'}
function startGrammar(i){chapter=i;q=0;chosen=null;typed='';session=[];page='grammarTask';render()}
function grammarTask(){let g=grammar[chapter];if(q>=g.qs.length)return completed('grammar');let a=g.qs[q],mc=Array.isArray(a[1]);return '<div class="panel"><span class="tag">Unit 1 · '+g.name+'</span><div class="row"><h2>Mini-Training</h2><span class="pill">'+(q+1)+' / '+g.qs.length+'</span></div><div class="rule"><strong>💡 Merkhilfe</strong><p>'+esc(g.rule)+'</p><span class="example">'+esc(g.ex)+'</span></div><div class="q">'+esc(a[0])+'</div>'+(mc?'<div class="choices">'+a[1].map((o,i)=>'<button class="choice '+(chosen!==null?(i===a[2]?'right':i===chosen?'wrong':''):'')+'" '+(chosen!==null?'disabled':'')+' onclick="chooseGrammar('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div>':'<input class="answer" aria-label="Deine Antwort" placeholder="Schreibe die Form ..." value="'+esc(typed)+'" '+(chosen!==null?'disabled':'')+' oninput="typed=this.value"><div class="actions"><button class="btn" '+(chosen!==null?'disabled':'')+' onclick="writeGrammar()">Prüfen</button></div>')+(chosen!==null?'<div class="feedback"><strong>'+(session.at(-1).correct?'✅ Richtig!':'💛 Guter Versuch!')+'</strong><p>'+esc(mc?a[3]:a[2])+'</p></div><div class="actions"><button class="btn primary" onclick="q++;chosen=null;typed=\'\';render()">Weiter →</button></div>':'<div class="notice">Kein Zeitlimit. Überlege in Ruhe.</div>')+'</div>'}
function chooseGrammar(i){if(chosen!==null)return;let g=grammar[chapter],a=g.qs[q];chosen=i;record('Grammatik',g.id,a[0],a[1][i],a[1][a[2]],i===a[2]);render()}
function writeGrammar(){if(chosen!==null||!typed.trim())return;let g=grammar[chapter],a=g.qs[q],ok=typed.trim().toLowerCase()===a[1].toLowerCase();chosen=ok?'yes':'no';record('Grammatik',g.id,a[0],typed,a[1],ok);render()}
function verbsHome(){return '<div class="panel"><span class="tag">Irregular Verbs</span><h2>🧠 Verb-Merkwerkstatt</h2><p>Wir lernen zuerst mit Mustern, dann durch aktives Erinnern. Übe lieber täglich fünf Minuten als einmal ganz lange.</p><div class="rule"><strong>Vier Merkmuster</strong><p>🔁 put – put – put: alles gleich<br>👯 buy – bought – bought: zwei gleich<br>🎵 sing – sang – sung: i – a – u<br>🧩 go – went – gone: drei verschiedene Formen</p></div><div class="grid">'+['1 · Erkennen','2 · Schreiben','3 · Im Satz'].map((t,i)=>'<button class="card" onclick="startVerbs('+i+')"><strong>'+t+'</strong><span>'+(i===0?'Multiple Choice':i===1?'Zweite und dritte Form':'Passende Vergangenheitsform')+'</span><span class="small">10 Aufgaben</span></button>').join('')+'</div><div class="notice">Aussprache: read – read – read wird in der Vergangenheit wie „red“ gesprochen.</div></div>'}
function startVerbs(i){stage=i;vi=0;chosen=null;typed='';session=[];page='verbTask';render()}
function verbAt(){return verbs[(vi*7+stage*3)%verbs.length]}
function verbTask(){if(vi>=10)return completed('verbs');let v=verbAt(),expected=stage===1?v[1]+' / '+v[2]:(stage===2&&v[0]==='be'?'was':v[1]),prompt=stage===0?'Welche Simple-Past-Form gehört zu '+v[0]+'?':stage===1?'Schreibe Simple Past und Past Participle von '+v[0]+'.':'Ergänze: Yesterday I ___ . (Verb: '+v[0]+')';let opts=[v[1],verbs[(vi*7+3)%verbs.length][1],verbs[(vi*7+9)%verbs.length][1]];if(stage===2){let phrases={be:'Yesterday I ___ at home.',go:'Yesterday I ___ to London.',see:'Yesterday I ___ a film.',do:'Yesterday I ___ my homework.',have:'Yesterday I ___ a sandwich.',make:'Yesterday I ___ a cake.',buy:'Yesterday I ___ a ticket.',think:'Yesterday I ___ about my holiday.',write:'Yesterday I ___ a letter.',eat:'Yesterday I ___ an apple.',take:'Yesterday I ___ a photo.',give:'Yesterday I ___ a present.',sing:'Yesterday I ___ a song.',drink:'Yesterday I ___ some water.',swim:'Yesterday I ___ in the pool.',come:'Yesterday I ___ home.',run:'Yesterday I ___ to school.',put:'Yesterday I ___ my bag on the chair.',read:'Yesterday I ___ a book.',build:'Yesterday I ___ a house.',find:'Yesterday I ___ my keys.',say:'Yesterday I ___ hello.'};prompt=phrases[v[0]]+' (Simple Past von '+v[0]+')'}return '<div class="panel"><span class="tag">Irregular Verbs · Level '+(stage+1)+'</span><div class="row"><h2>Verb '+(vi+1)+' / 10</h2><button class="btn" onclick="speak('+JSON.stringify(v[0])+')">🔊 '+esc(v[0])+'</button></div><div class="rule"><strong>🧠 Merkhilfe</strong><p>'+esc(v[4])+'</p><span class="example">'+esc(v[0])+' · '+esc(v[3])+'</span></div><div class="q">'+esc(prompt)+'</div>'+(stage===0?'<div class="choices">'+opts.map((o,i)=>'<button class="choice '+(chosen!==null?(i===0?'right':i===chosen?'wrong':''):'')+'" '+(chosen!==null?'disabled':'')+' onclick="chooseVerb('+i+')">'+esc(o)+'</button>').join('')+'</div>':'<input class="answer" aria-label="Verbform" placeholder="'+(stage===1?'z. B. went / gone':'Deine Antwort')+'" value="'+esc(typed)+'" '+(chosen!==null?'disabled':'')+' oninput="typed=this.value"><div class="actions"><button class="btn" '+(chosen!==null?'disabled':'')+' onclick="writeVerb()">Prüfen</button></div>')+(chosen!==null?'<div class="feedback"><strong>'+(session.at(-1).correct?'✅ Richtig!':'💛 Guter Versuch!')+'</strong><p>Richtige Form: <b>'+esc(expected)+'</b></p></div><div class="actions"><button class="btn primary" onclick="vi++;chosen=null;typed=\'\';render()">Weiter →</button></div>':'')+'</div>'}
function chooseVerb(i){if(chosen!==null)return;let v=verbAt(),options=[v[1],verbs[(vi*7+3)%verbs.length][1],verbs[(vi*7+9)%verbs.length][1]];chosen=i;record('Irregular Verbs','Level 1',v[0],options[i],v[1],i===0);render()}
function writeVerb(){if(chosen!==null||!typed.trim())return;let v=verbAt(),expected=stage===1?v[1]+' / '+v[2]:(stage===2&&v[0]==='be'?'was':v[1]),norm=s=>s.toLowerCase().replace(/\s+/g,'').replace(/[;,]/g,'/'),ok=norm(typed)===norm(expected);chosen=ok?'yes':'no';record('Irregular Verbs','Level '+(stage+1),v[0],typed,expected,ok);render()}
function listenHome(){return '<div class="panel"><span class="tag">Unit 1 · G1–G4</span><h2>🎧 Listening Workshop</h2><p>Höre zuerst den Satz, ohne ihn zu lesen. Beantworte danach die Frage. Du kannst beliebig oft auf den Lautsprecher tippen.</p><div class="notice">Die englische Stimme kommt von deinem Browser. Klang und Verfügbarkeit hängen vom Gerät ab.</div><button class="btn primary" onclick="startListen()">Hörtraining starten →</button></div>'}
function startListen(){li=0;chosen=null;session=[];page='listenTask';render()}
function listenTask(){if(li>=listening.length)return completed('listening');let l=listening[li];return '<div class="panel"><span class="tag">Unit 1 · '+l[0]+' · Listening</span><div class="row"><h2>Listen carefully!</h2><span class="pill">'+(li+1)+' / '+listening.length+'</span></div><div class="audio"><span class="emoji">🎧</span><button class="btn primary" onclick="playListening()">🔊 Satz anhören</button><button class="btn" onclick="playListening()">↻ Wiederholen</button></div><p id="audioStatus" class="small" role="status">Tippe auf den Lautsprecher.</p><div class="q">'+esc(l[2])+'</div><div class="choices">'+l[3].map((o,i)=>'<button class="choice '+(chosen!==null?(i===l[4]?'right':i===chosen?'wrong':''):'')+'" '+(chosen!==null?'disabled':'')+' onclick="chooseListen('+i+')">'+esc(o)+'</button>').join('')+'</div>'+(chosen!==null?'<div class="feedback"><strong>'+(session.at(-1).correct?'✅ Richtig!':'💛 Guter Versuch!')+'</strong><p>Gehört: <b>'+esc(l[1])+'</b></p><p>'+esc(l[5])+'</p></div><div class="actions"><button class="btn primary" onclick="li++;chosen=null;render()">Weiter →</button></div>':'<div class="notice">Du kannst den Satz beliebig oft anhören.</div>')+'</div>'}
function speak(s){if(!('speechSynthesis' in window)){alert('Dieser Browser unterstützt leider keine Sprachausgabe.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.85;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;u.onerror=()=>{let e=document.getElementById('audioStatus');if(e)e.textContent='Die Wiedergabe ist fehlgeschlagen. Bitte Toneinstellungen prüfen.'};speechSynthesis.speak(u)}catch(e){alert('Sprachausgabe konnte nicht gestartet werden.')}}
function playListening(){let e=document.getElementById('audioStatus');if(e)e.textContent='Der Satz wird abgespielt ...';speak(listening[li][1])}
function chooseListen(i){if(chosen!==null)return;let l=listening[li];chosen=i;record('Listening',l[0],l[2],l[3][i],l[3][l[4]],i===l[4]);render()}
function completed(section){return '<div class="panel"><div class="emoji">🌟</div><h2>Training geschafft!</h2><p>'+session.length+' Aufgaben bearbeitet · '+session.filter(x=>x.correct).length+' richtig. Jeder Versuch hilft dir weiter!</p><button class="btn primary" onclick="go(\''+section+'\')">Weiterüben →</button></div>'}
function coach(){let right=hist.filter(x=>x.correct).length,days=new Set(hist.map(x=>x.date.slice(0,10))).size;return '<div class="panel"><span class="tag">Lerncoach · lokale Auswertung</span><h2>📊 Lernfortschritt</h2><p>Die Ergebnisse sind Beobachtungen und keine Diagnose. Daten sind nur auf diesem Gerät sichtbar.</p><div class="stats"><div class="stat"><strong>'+hist.length+'</strong>Antworten</div><div class="stat"><strong>'+(hist.length?Math.round(right/hist.length*100):0)+' %</strong>richtig</div><div class="stat"><strong>'+days+'</strong>Übungstage</div></div>'+['Grammatik','Irregular Verbs','Listening'].map(a=>{let h=hist.filter(x=>x.area===a),pct=h.length?Math.round(h.filter(x=>x.correct).length/h.length*100):0;return '<div class="item"><div class="row"><strong>'+a+'</strong><span class="small">'+h.length+' Antworten · '+pct+' %</span></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join('')+'<h3>Letzte Fehler</h3>'+(hist.filter(x=>!x.correct).slice(-12).reverse().map(x=>'<details><summary>'+esc(x.area)+' · '+esc(x.topic)+' · '+new Date(x.date).toLocaleDateString('de-DE')+'</summary><p>'+esc(x.question)+'</p><p>Antwort: '+esc(x.answer)+'<br>Richtig: <b>'+esc(x.expected)+'</b></p></details>').join('')||'<p>Noch keine Fehlversuche gespeichert.</p>')+'<div class="notice">Keine Anmeldung und kein Zugriff von anderen Geräten. Für eine geschützte Online-Auswertung wäre später eine Datenbank erforderlich.</div><div class="actions"><button class="btn primary" onclick="exportCSV()">CSV-Auswertung herunterladen</button><button class="btn" onclick="clearData()">Lerndaten löschen</button></div></div>'}
function exportCSV(){let rows=[['Datum','Bereich','Thema','Aufgabe','Antwort','Richtig','Korrekt']].concat(hist.map(x=>[x.date,x.area,x.topic,x.question,x.answer,x.expected,x.correct?'Ja':'Nein']));let csv='\uFEFF'+rows.map(r=>r.map(s=>'"'+String(s).replace(/"/g,'""')+'"').join(';')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='verena-englisch-lernstand.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function clearData(){if(confirm('Alle Lerndaten auf diesem Gerät wirklich löschen?')){hist=[];save();render()}}
function render(){app.innerHTML=navigation()+(page==='home'?home():page==='grammar'?grammarHome():page==='grammarTask'?grammarTask():page==='verbs'?verbsHome():page==='verbTask'?verbTask():page==='listening'?listenHome():page==='listenTask'?listenTask():coach())}render();
</script></body></html>
